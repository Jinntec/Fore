<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes" name="viewport"/>
    <title>Report</title>
    <link href="../../resources/fore.css" rel="stylesheet">
    <link href="view-mode.css" rel="stylesheet">
    <link href="default.css" rel="stylesheet">
    <script type="module" src="fore-dev.js"></script>
    <script type="module" src="view-mode.js"></script>
    <style>
        /* default.css locks body/fx-fore to a fixed 100vh with overflow:hidden,
           which is right for page.html standalone (nav/main scroll internally)
           but here report.html stacks a dropzone + summary table above the
           included report, so the whole page needs to scroll normally instead. */
        body {
            display: block;
            height: auto;
            overflow: visible;
        }
        fx-fore {
            height: auto;
        }
        .wrapper {
            margin: 1rem;
        }
        #dropzone {
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 3rem 1rem;
            text-align: center;
            color: #666;
            margin-bottom: 1rem;
            transition: background-color .15s, border-color .15s;
        }
        #dropzone.dragover {
            background-color: #eef6ff;
            border-color: #3a86ff;
            color: #333;
        }
        #error {
            color: #b00020;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <h1>Prüfbericht</h1>

    <!-- xpath-default-namespace/xmlns:cvr must sit on an actual ancestor of every ref/{} binding
         (fx-model is a sibling of the table below, not an ancestor, so it wouldn't be seen) -->
    <fx-fore xpath-default-namespace="http://www.xproc.org/ns/xvrl"
             xmlns:cvr="urn:conformatron:cvr:draft"
             xmlns:ubl="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"
             xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2"
             xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
        <fx-model>

            <fx-instance id="default"></fx-instance>
            <fx-bind ref="instance('default')" readonly="true()"></fx-bind>
<!--
            <fx-instance id="target">
                <data></data>
            </fx-instance>
-->

            <!-- staging instance: holds the freshly dropped document until fx-replace swaps it in -->
            <fx-instance id="dropped">
                <data></data>
            </fx-instance>

            <fx-instance id="doc"></fx-instance>

            <fx-action event="xml-dropped" target="#window">
                <fx-replace ref="instance('default')" with="instance('dropped')//*:message[@xml:id='parse-document-content']/*[1]"></fx-replace>
                <fx-dispatch name="load-document" target="#include"></fx-dispatch>
            </fx-action>
        </fx-model>
        <div id="dropzone">Drag &amp; drop an .xml file here</div>
        <p id="drop-error"></p>

        <h2>Angaben zum geprüften Dokument</h2>
        <fx-group ref="$dropped">
            <table>
                <tr>
                    <td>Referenz</td>
                    <td>{metadata/document/@href}</td>
                </tr>
                <tr>
                    <td>Zeitpunkt der Prüfung</td>
                    <td>{metadata/timestamp}</td>
                </tr>
                <tr>
                    <td>Erkannter Dokumenttyp</td>
                    <td>{report/detection/@cvr:scenario-id}</td>
                </tr>
            </table>
        </fx-group>
        <section class="document">
            <header>Geprüftes Dokument</header>
            <fx-include id="include" src="page.html" selector="div.layout" event="load-document" target="window"></fx-include>
        </section>
    </fx-fore>
</div>

<script type="module">
    const dropzone = document.getElementById('dropzone');
    const errorEl = document.getElementById('drop-error');
    const fore = document.querySelector('fx-fore');

    // page.html is lazily pulled in on drop; once it lands, open all its
    // <details> sections so their nested fx-include sections load right away
    // instead of staying collapsed until the user clicks each one.
    document.getElementById('include').addEventListener('include-done', e => {
        if (e.target.id !== 'include') return;
        e.target.querySelectorAll('details').forEach(details => {
            details.open = true;
        });
    });

    ['dragenter', 'dragover'].forEach(evt =>
        dropzone.addEventListener(evt, e => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        }),
    );
    ['dragleave', 'drop'].forEach(evt =>
        dropzone.addEventListener(evt, () => dropzone.classList.remove('dragover')),
    );

    dropzone.addEventListener('drop', async e => {
        e.preventDefault();
        errorEl.textContent = '';

        const file = e.dataTransfer.files[0];
        if (!file) return;
        if (!/\.xml$/i.test(file.name) && file.type && !file.type.endsWith('xml')) {
            errorEl.textContent = `"${file.name}" does not look like an XML file.`;
            return;
        }

        const text = await file.text();
        const parsed = new DOMParser().parseFromString(text, 'application/xml');
        if (parsed.querySelector('parsererror')) {
            errorEl.textContent = `Could not parse "${file.name}" as XML.`;
            return;
        }

        // stage the parsed document in the 'dropped' instance, then let the declarative
        // fx-replace action (bound to the 'xml-dropped' event) swap it into the default instance
        fore.getModel().getInstance('dropped').instanceData = parsed;
        window.dispatchEvent(new CustomEvent('xml-dropped'));
    });
</script>
</body>
</html>
