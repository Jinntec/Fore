                                <option value="705" title="Negotiable document/message which evidences a contract of carriage by sea and the taking over or loading of goods by carrier, and by which carrier undertakes to deliver goods against surrender of the document. A provision in the document that goods are to be delivered to the order of a named person, or to order, or to bearer, constitutes such an undertaking.">Bill of lading</option>
                                <option value="706" title="The original of the bill of lading issued by a transport company. When issued by the maritime industry it could signify ownership of the cargo.">Bill of lading original</option>
                                <option value="707" title="A copy of the bill of lading issued by a transport company.">Bill of lading copy</option>
                                <option value="708" title="Bill of lading indicating an empty container.">Empty container bill</option>
                                <option value="709" title="Document which evidences a transport of liquid bulk cargo.">Tanker bill of lading</option>
                                <option value="710" title="Non-negotiable document which evidences a contract for the carriage of goods by sea and the taking over of the goods by the carrier, and by which the carrier undertakes to deliver the goods to the consignee named in the document.">Sea waybill</option>
                                <option value="711" title="Negotiable transport document made out to a named person, to order or to bearer, signed by the carrier and handed to the sender after receipt of the goods.">Inland waterway bill of lading</option>
                                <option value="712" title="Non-negotiable document which evidences a contract for the carriage of goods by sea and the taking over or loading of the goods by the carrier, and by which the carrier undertakes to deliver the goods to the consignee named in the document. E.g. Sea waybill. Remark: Synonymous with &#34;straight&#34; or &#34;non-negotiable Bill of lading&#34; used in certain countries, e.g. Canada.">Non-negotiable maritime transport document (generic)</option>
                                <option value="713" title="Document/message issued by a ship's officer to acknowledge that a specified consignment has been received on board a vessel, and the apparent condition of the goods; enabling the carrier to issue a Bill of lading.">Mate's receipt</option>
                                <option value="714" title="The bill of lading issued not by the carrier but by the freight forwarder/consolidator known by the carrier.">House bill of lading</option>
                                <option value="715" title="Document/message issued by a commercial party or a bank of an insurance company accepting responsibility to the beneficiary of the indemnity in accordance with the terms thereof.">Letter of indemnity for non-surrender of bill of lading</option>
                                <option value="716" title="Non-negotiable document issued by a freight forwarder evidencing a contract for the carriage of goods by sea and the taking over or loading of the goods by the freight forwarder, and by which the freight forwarder undertakes to deliver the goods to the consignee named in the document.">Forwarder's bill of lading</option>
                                <option value="717" title="A document authorizing residence.">Residence permit</option>
                                <option value="718" title="A national identity document issued to professional seamen that contains a record of their rank and service career.">Seaman’s book</option>
                                <option value="719" title="Document/message providing agreed textual information.">General message</option>
                                <option value="720" title="Transport document constituting a contract for the carriage of goods between the sender and the carrier (the railway). For international rail traffic, this document must conform to the model prescribed by the international conventions concerning carriage of goods by rail, e.g. CIM Convention, SMGS Convention.">Rail consignment note (generic term)</option>
                                <option value="721" title="Document/message responding to a previously received Product Data document/message.">Product data response</option>
                                <option value="722" title="Accounting document, one copy of which is drawn up for each consignment note; it accompanies the consignment over the whole route and is a rail transport document.">Road list-SMGS</option>
                                <option value="723" title="Document/message which gives right to the owner to exert all functions normally transferred to a guard in a train by which an escorted consignment is transported.">Escort official recognition</option>
                                <option value="724" title="Fictitious transport document regarding a previous transport, enabling a carrier's agent to give to another carrier's agent (in a different country) the possibility to collect charges relating to the original transport (rail environment).">Recharging document</option>
                                <option value="725" title="Document/message providing details of an order which has been raised by a manufacturer.">Manufacturer raised order</option>
                                <option value="726" title="Document/message providing details of a consignment order which has been raised by a manufacturer.">Manufacturer raised consignment order</option>
                                <option value="727" title="A price/sales catalogue message containing no commercial information, such as prices, terms or conditions.">Price/sales catalogue not containing commercial information</option>
                                <option value="728" title="A price/sales catalogue message containing only commercial terms or conditions data.">Price/sales catalogue containing commercial information</option>
                                <option value="729" title="Document/message by means of which the buyer informs the seller about the despatch of returned goods.">Returns advice</option>
                                <option value="730" title="Transport document/message which evidences a contract between a carrier and a sender for the carriage of goods by road (generic term). Remark: For international road traffic, this document must contain at least the particulars prescribed by the convention on the contract for the international carriage of goods by road (CMR).">Road consignment note</option>
                                <option value="731" title="A message enabling the transmission of commercial data concerning payments made and outstanding items on an account over a period of time.">Commercial account summary</option>
                                <option value="732" title="A message by which a party announces to another party details of goods for return due to specified reasons (e.g. returns for repair, returns because of damage, etc).">Announcement for returns</option>
                                <option value="733" title="A message by which a party informs another party whether and how goods shall be returned.">Instruction for returns</option>
                                <option value="734" title="A message enabling companies to exchange or report electronically, basic sales forecast data related to products or services, including the corresponding location, time period, product identification, pricing and quantity information. It enables the recip.">Sales forecast report</option>
                                <option value="735" title="A message enabling companies to exchange or report electronically, basic sales data related to products or services, including the corresponding location, time period, product identification, pricing and quantity information. It enables the recipient to p.">Sales data report</option>
                                <option value="736" title="A product inquiry which stands until it is cancelled. It requests not only the updates since last time, but always the complete product information of a data supplier. This means that within the standing request every time a complete download of the respe.">Standing inquiry on complete product information</option>
                                <option value="737" title="A message by which a consignee provides for a carrier proof of delivery of a consignment.">Proof of delivery</option>
                                <option value="738" title="A message from a party to a warehouse, distribution centre, or logistics service provider identifying the handling services and where required the movement of specified goods, limited to warehouses within the jurisdiction of the distribution centre or log.">Cargo/goods handling and movement message</option>
                                <option value="739" title="Document/message providing metered consumption details supporiting an invoice.">Metered services consumption report supporting an invoice</option>
                                <option value="740" title="Document/message made out by or on behalf of the shipper which evidences the contract between the shipper and carrier(s) for carriage of goods over routes of the carrier(s) and which is identified by the airline prefix issuing the document plus a serial (IATA).">Air waybill</option>
                                <option value="741" title="Document/message made out by or on behalf of the agent/consolidator which evidences the contract between the agent/consolidator and carrier(s) for carriage of goods over routes of the carrier(s) for a consignment consisting of goods originated by more than one shipper (IATA).">Master air waybill</option>
                                <option value="742" title="Document/message providing metered consumption details.">Metered services consumption report</option>
                                <option value="743" title="A temporary air waybill which contains only limited information because of the absence of the original.">Substitute air waybill</option>
                                <option value="744" title="Declaration to Customs regarding the personal effects of crew members aboard the conveyance; equivalent to IMO FAL 4.">Crew's effects declaration</option>
                                <option value="745" title="Declaration to Customs regarding passengers aboard the conveyance; equivalent to IMO FAL 6.">Passenger list</option>
                                <option value="746" title="Document/message created by the consignor or by the departure station, joined to the transport or sent to the consignee, giving the possibility to the consignee or the arrival station to attest the delivery of the goods. The document must be returned to the consignor or to the departure station.">Delivery notice (rail transport)</option>
                                <option value="747" title="A message sent by a party (usually an employer or its representative) to a service providing organisation, to detail payroll deductions paid on behalf of its employees to the service providing organisation.">Payroll deductions advice</option>
                                <option value="748" title="Document/message by means of which the supplier informs the buyer about the despatch of goods ordered on consignment (goods to be delivered into stock with agreement on payment when goods are sold out of this stock).">Consignment despatch advice</option>
                                <option value="749" title="Message containing information regarding gross mass verification of transport equipment.">Transport equipment gross mass verification message</option>
                                <option value="750" title="Document/message which, according to Article 106 of the &#34;Agreement concerning Postal Parcels&#34; under the UPU convention, is to accompany post parcels.">Despatch note (post parcels)</option>
                                <option value="751" title="A document / message containing accounting related information such as monetary summations, seller id and VAT information. This may not be a complete invoice according to legal requirements. For instance the line item information might be excluded.">Invoice information for accounting purposes</option>
                                <option value="752" title="Document/message issued by a competent body certifying the phytosanitary status of plants or plant products for international trade.">Plant Passport</option>
                                <option value="753" title="Document/message issued by a competent body certifying sustainability.">Certificate of sustainability</option>
                                <option value="754" title="A document/message used by a buyer to define the procurement procedure and request suppliers to participate.">Call for tender</option>
                                <option value="755" title="A document/message used by a buyer to define the procurement procedure and request specific suppliers to participate.">Invitation to tender</option>
                                <option value="756" title="A document/message requesting a self-declaration from the supplier, providing preliminary evidence during the tendering phase.">European Single Procurement Document request</option>
                                <option value="757" title="A document/message requesting information regarding pricing and catalogue details for goods and/or services to be offered as part of a tender.">Tendering price/sales catalogue request</option>
                                <option value="758" title="A document/message used by a supplier to bid in a procurement procedure.">Tender</option>
                                <option value="759" title="A document/message containing a self-declaration by the supplier, providing preliminary evidence during the tendering phase.">European Single Procurement Document</option>
                                <option value="760" title="A transport document used when more than one mode of transportation is involved in the movement of cargo. It is a contract of carriage and receipt of the cargo for a multimodal transport. It indicates the place where the responsible transport company in the move takes responsibility for the cargo, the place where the responsibility of this transport company in the move ends and the conveyances involved.">Multimodal/combined transport document (generic)</option>
                                <option value="761" title="Bill of lading which evidences a contract of carriage from one place to another in separate stages of which at least one stage is a sea transit, and by which the issuing carrier accepts responsibility for the carriage as set forth in the through bill of lading.">Through bill of lading</option>
                                <option value="762" title="A document/message providing information regarding pricing and catalogue details for goods and/or services to be offered as part of a tender.">Tendering price/sales catalogue</option>
                                <option value="763" title="Negotiable document/message issued by a forwarder to certify that he has taken charge of a specified consignment for despatch and delivery in accordance with the consignor's instructions, as indicated in the document, and that he accepts responsibility for delivery of the goods to the holder of the document through the intermediary of a delivery agent of his choice. E.g. FIATA-FCT.">Forwarder's certificate of transport</option>
                                <option value="764" title="Negotiable or non-negotiable document evidencing a contract for the performance and/or procurement of performance of combined transport of goods and bearing on its face either the heading &#34;Negotiable combined transport document issued subject to Uniform Rules for a Combined Transport Document (ICC Brochure No. 298)&#34; or the heading &#34;Non-negotiable Combined Transport Document issued subject to Uniform Rules for a Combined Transport Document (ICC Brochure No. 298)&#34;.">Combined transport document (generic)</option>
                                <option value="765" title="Document/message which evidences a multimodal transport contract, the taking in charge of the goods by the multimodal transport operator, and an undertaking by him to deliver the goods in accordance with the terms of the contract. (International Convention on Multimodal Transport of Goods).">Multimodal transport document (generic)</option>
                                <option value="766" title="Document which evidences a multimodal transport contract, the taking in charge of the goods by the multimodal transport operator, and an undertaking by him to deliver the goods in accordance with the terms of the contract.">Combined transport bill of lading/multimodal bill of lading</option>
                                <option value="767" title="Document/message confirming a receipt to the sending party.">Acknowledgment of receipt</option>
                                <option value="768" title="Document which confirms the civil status of a person.">Civil status document</option>
                                <option value="769" title="Document reporting advice.">Advice report</option>
                                <option value="770" title="Document/message issued by a carrier to confirm that space has been reserved for a consignment in means of transport.">Booking confirmation</option>
                                <option value="771" title="Document which is a binding offer from one party to another.">Binding offer</option>
                                <option value="772" title="Document which is a binding agreement from the customer for a contract, such as an insurance contract.">Binding customer agreement for contract</option>
                                <option value="773" title="Document confirming that insurance coverage is granted.">Coverage confirmation note</option>
                                <option value="774" title="Document specifying general terms and conditions.">General terms and conditions</option>
                                <option value="775" title="Instructions for release or delivery of goods.">Calling forward notice</option>
                                <option value="776" title="Document specifying the clauses applying to a contract.">Contract clauses</option>
                                <option value="777" title="Document specifying the individual conditions or clauses applying to a specific contract.">Specific contract conditions</option>
                                <option value="778" title="Document stating the rules of a group insurance contract.">Group insurance rules</option>
                                <option value="779" title="Document consisting of a series of questions.">Questionnaire</option>
                                <option value="780" title="Document/message issued by a transport operation specifying freight costs and charges incurred for a transport operation and stating conditions of payment.">Freight invoice</option>
                                <option value="781" title="Notification from the carrier to the consignee in writing, by telephone or by any other means (express letter, message, telegram, etc.) informing him that a consignment addressed to him is being or will shortly be held at his disposal at a specified point in the place of destination.">Arrival notice (goods)</option>
                                <option value="782" title="Request made by the carrier to the sender, or, as the case may be, the consignee, for instructions as to the disposal of the consignment when circumstances prevent delivery and the return of the goods has not been requested by the consignor in the transport document.">Notice of circumstances preventing delivery (goods)</option>
                                <option value="783" title="Request made by the carrier to the sender, or, the consignee as the case may be, for instructions as to the disposal of the goods when circumstances prevent transport before departure or en route, after acceptance of the consignment concerned.">Notice of circumstances preventing transport (goods)</option>
                                <option value="784" title="Notification in writing, sent by the carrier to the sender, to inform him at his request of the actual date of delivery of the goods.">Delivery notice (goods)</option>
                                <option value="785" title="Listing of goods comprising the cargo carried in a means of transport or in a transport-unit. The cargo manifest gives the commercial particulars of the goods, such as transport document numbers, consignors, consignees, shipping marks, number and kind of packages and descriptions and quantities of the goods.">Cargo manifest</option>
                                <option value="786" title="Document/message containing the same information as a cargo manifest, and additional details on freight amounts, charges, etc.">Freight manifest</option>
                                <option value="787" title="Document/message used in road transport, listing the cargo carried on a road vehicle, often referring to appended copies of Road consignment note.">Bordereau</option>
                                <option value="788" title="Document/message specifying the contents of particular freight containers or other transport units, prepared by the party responsible for their loading into the container or unit.">Container manifest (unit packing list)</option>
                                <option value="789" title="Document used by the rail organization to indicate freight charges or additional charges in each case where the departure station is not able to calculate the charges for the total voyage (e.g. tariff not yet updated, part of voyage not covered by the tariff). This document must be considered as joined to the transport.">Charges note</option>
                                <option value="790" title="(1030) Document that is joined to the transport or sent by separate means, giving to the departure rail organization the proof that the cash-on delivery amount has been encashed by the arrival rail organization before reimbursement of the consignor.">Advice of collection</option>
                                <option value="791" title="Document certifying a ship's safety to a specified date.">Safety of ship certificate</option>
                                <option value="792" title="Document certifying the safety of a ship's radio facilities to a specified date.">Safety of radio certificate</option>
                                <option value="793" title="Document certifying the safety of a ship's equipment to a specified date.">Safety of equipment certificate</option>
                                <option value="794" title="Document declaring a ship owner's liability for oil propelling or carried on a vessel.">Civil liability for oil certificate</option>
                                <option value="795" title="Document specifying the limit of a ship's legal submersion under various conditions.">Loadline document</option>
                                <option value="796" title="Document certifying that a ship is free of rats, valid to a specified date.">Derat document</option>
                                <option value="797" title="Document certifying the health condition on board a vessel, valid to a specified date.">Maritime declaration of health</option>
                                <option value="798" title="Official certificate stating the vessel's registry.">Certificate of registry</option>
                                <option value="799" title="Declaration to Customs regarding the contents of the ship's stores (equivalent to IMO FAL 3) i.e. goods intended for consumption by passengers/crew on board vessels, aircraft or trains, whether or not sold or landed; goods necessary for operation/maintenance of conveyance, including fuel/lubricants, excluding spare parts/equipment (IMO).">Ship's stores declaration</option>
                                <option value="810" title="Application for a permit issued by a government authority permitting exportation of a specified commodity subject to specified conditions as quantity, country of destination, etc.">Export licence, application for</option>
                                <option value="811" title="Permit issued by a government authority permitting exportation of a specified commodity subject to specified conditions as quantity, country of destination, etc. Synonym: Embargo permit.">Export licence</option>
                                <option value="812" title="Document/message completed by an exporter/seller as a means whereby the competent body may control that the amount of foreign exchange accrued from a trade transaction is repatriated in accordance with the conditions of payment and exchange control regulations in force.">Exchange control declaration, export</option>
                                <option value="813" title="Declaration document to identify the final beneficiary of an asset.">Declaration of final beneficiary</option>
                                <option value="814" title="Statement regarding the Foreign Account Tax Compliance Act (FATCA) of the United States of America.">US, FATCA statement</option>
                                <option value="815" title="Document reporting (e.g. annually) to the insured the actual details of an insurance contract.">Insured status report</option>
                                <option value="816" title="Information document for the group pension commitment to an individual person.">Group pension commitment information</option>
                                <option value="817" title="Document notifying a claim.">Claim notification</option>
                                <option value="818" title="Document reporting an assessment.">Assessment report</option>
                                <option value="819" title="Document specifying the value of a loss.">Loss statement</option>
                                <option value="820" title="European community transit declaration.">Despatch note model T</option>
                                <option value="821" title="Transit declaration for goods circulating under internal community transit procedures (between European Union (EU) countries).">Despatch note model T1</option>
                                <option value="822" title="Ascertainment that the declared goods were originally produced in an European Union (EU) country.">Despatch note model T2</option>
                                <option value="823" title="Control document (export declaration) used particularly in case of re-sending without use with only VAT collection, refusal, unconformity with contract etc.">Control document T5</option>
                                <option value="824" title="Rail consignment note prepared by the consignor for the facilitation of an eventual return to the origin of the goods.">Re-sending consignment note</option>
                                <option value="825" title="Ascertainment that the declared goods were originally produced in an European Union (EU) country. May only be used for goods that are loaded on one single means of transport in one single departure point for one single delivery point.">Despatch note model T2L</option>
                                <option value="826" title="Document certifying the guarantee of the document issuer that he will pay for costs of the addressee, e.g. the costs for repairing a vehicle.">Guarantee of cost acceptance</option>
                                <option value="827" title="Document reporting the closing of a claim file.">Close of claim</option>
                                <option value="828" title="Document stating the refusal of a claim.">Refusal of claim</option>
                                <option value="829" title="Document reporting a valuation.">Valuation report</option>
                                <option value="830" title="Document/message by which goods are declared for export Customs clearance, conforming to the layout key set out at Appendix I to Annex C.1 concerning outright exportation to the Kyoto convention (CCC). Within a Customs union, &#34;for despatch&#34; may have the same meaning as &#34;for exportation&#34;.">Goods declaration for exportation</option>
                                <option value="831" title="Document which certifies the history of claims.">Claim history certificate</option>
                                <option value="832" title="Document specifying an accounting statement.">Accounting statement</option>
                                <option value="833" title="Generic term, sometimes referred to as Freight declaration, applied to the documents providing the particulars required by the Customs concerning the cargo (freight) carried by commercial means of transport (CCC).">Cargo declaration (departure)</option>
                                <option value="834" title="Document confirming the receipt of a payment.">Payment receipt confirmation</option>
                                <option value="835" title="Document certifying the payment of the insurance premium.">Certificate of paid insurance premium</option>
                                <option value="836" title="Report about payments done towards an insured party.">Insured party payment report</option>
                                <option value="837" title="Report about payments done towards a third party.">Third party payment report</option>
                                <option value="838" title="Document giving the addressee the right to debit from an account of the authorizing party.">Direct debit authorisation</option>
                                <option value="839" title="Report issued by a medical doctor.">Physician report</option>
                                <option value="840" title="Document/message submitted to a competent body by party requesting a Goods control certificate to be issued in accordance with national or international standards, or conforming to legislation in the importing country, or as specified in the contract.">Application for goods control certificate</option>
                                <option value="841" title="Document/message issued by a competent body evidencing the quality of the goods described therein, in accordance with national or international standards, or conforming to legislation in the importing country, or as specified in the contract.">Goods control certificate</option>
                                <option value="842" title="Document certifying a medical condition.">Medical certificate</option>
                                <option value="843" title="Document containing a report of a witness.">Witness report</option>
                                <option value="844" title="Document detailing a calculation, such as an invoice calculation or a costs calculation.">Calculation note</option>
                                <option value="845" title="Document containing a communication from the opposite party, such as in legal action.">Communication from opposite party</option>
                                <option value="846" title="Document specifying an amicable agreement.">Amicable agreement</option>
                                <option value="847" title="Document which specifies an out of court settlement.">Out of court settlement</option>
                                <option value="848" title="Document specifying a legal action at court.">Legal action</option>
                                <option value="849" title="Document specifying a summons to court.">Summons</option>
                                <option value="850" title="Document/message submitted to a competent body by party requesting a Phytosanitary certificate to be issued.">Application for phytosanitary certificate</option>
                                <option value="851" title="A message/doucment consistent with the model for certificates of the IPPC, attesting that a consignment meets phytosanitary import requirements.">Phytosanitary certificate</option>
                                <option value="852" title="Document/message issued by the competent authority in the exporting country evidencing that alimentary and animal products, including dead animals, are fit for human consumption, and giving details, when relevant, of controls undertaken.">Sanitary certificate</option>
                                <option value="853" title="Document/message issued by the competent authority in the exporting country evidencing that live animals or birds are not infested or infected with disease, and giving details regarding their provenance, and of vaccinations and other treatment to which they have been subjected.">Veterinary certificate</option>
                                <option value="854" title="Document specifying a judgment of a court.">Court judgment</option>
                                <option value="855" title="Document/message submitted to a competent body by a party requesting an Inspection certificate to be issued in accordance with national or international standards, or conforming to legislation in the country in which it is required, or as specified in the contract.">Application for inspection certificate</option>
                                <option value="856" title="Document/message issued by a competent body evidencing that the goods described therein have been inspected in accordance with national or international standards, in conformity with legislation in the country in which the inspection is required, or as specified in the contract.">Inspection certificate</option>
                                <option value="857" title="Document which must be aboard the vehicle.">Vehicle aboard document</option>
                                <option value="858" title="Document consisting of an image.">Image</option>
                                <option value="859" title="Document consisting of an audio recording (e.g. a telephone conversation or alike).">Audio</option>
                                <option value="860" title="Document/message submitted to a competent body by an interested party requesting a Certificate of origin to be issued in accordance with relevant criteria, and on the basis of evidence of the origin of the goods.">Certificate of origin, application for</option>
                                <option value="861" title="Document/message identifying goods, in which the authority or body authorized to issue it certifies expressly that the goods to which the certificate relates originate in a specific country. The word &#34;country&#34; may include a group of countries, a region or a part of a country. This certificate may also include a declaration by the manufacturer, producer, supplier, exporter or other competent person.">Certificate of origin</option>
                                <option value="862" title="Appropriate statement as to the origin of the goods, made in connection with their exportation by the manufacturer, producer, supplier, exporter or other competent person on the Commercial invoice or any other document relating to the goods (CCC).">Declaration of origin</option>
                                <option value="863" title="Certificate drawn up in accordance with the rules laid down by an authority or approved body, certifying that the goods described therein qualify for a designation specific to the given region (e.g. champagne, port wine, Parmesan cheese).">Regional appellation certificate</option>
                                <option value="864" title="Document/message describing a certificate of origin meeting the requirements for preferential treatment.">Preference certificate of origin</option>
                                <option value="865" title="Specific form of certificate of origin for goods qualifying for preferential treatment under the generalized system of preferences (includes a combined declaration of origin and certificate, form A).">Certificate of origin form GSP</option>
                                <option value="866" title="Document consisting of a video.">Video</option>
                                <option value="867" title="A letter of introduction attached to, or accompanying another document such as an insurance policy.">Introductory letter</option>
                                <option value="868" title="Document specifying the terms of data protection regulations.">Data protection regulations statement</option>
                                <option value="869" title="Document expressing the mandate of a client for a service only by the mandated broker.">Exclusive brokerage mandate</option>
                                <option value="870" title="Document/message to be prepared by an exporter in his country and presented to a diplomatic representation of the importing country for endorsement and subsequently to be presented by the importer in connection with the import of the goods described therein.">Consular invoice</option>
                                <option value="871" title="Document expressing the mandate of a client for an inquiry service by the mandated provider.">Inquiry mandate</option>
                                <option value="872" title="Document specifying the analysis of risks.">Risk analysis</option>
                                <option value="873" title="A partial transport equipment movement report, containing only a selected part of the movements of transport equipment for a vessel in a port.">Transport equipment movement report, partial</option>
                                <option value="874" title="Declaration of the conveyance to a public authority.">Conveyance declaration</option>
                                <option value="875" title="Partial invoice in the context of a specific construction project.">Partial construction invoice</option>
                                <option value="876" title="Invoice concluding all previous partial construction invoices of a completed partial rendered service in the context of a specific construction project.">Partial final construction invoice</option>
                                <option value="877" title="Invoice concluding all previous partial invoices and partial final construction invoices in the context of a specific construction project.">Final construction invoice</option>
                                <option value="878" title="Certificate issued to business that fulfils specified criteria applied to the security and safety of the logistics chain in the flow of foreign trade operations by a national AEO recognized program (e.g. AEO-Security and Safety (AEOS) - Regulation (EU) No 952/2013).">AEO Certificate of Security and/or Safety</option>
