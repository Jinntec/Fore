<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes" name="viewport"/>
    <title>Anatomy of a Fore page</title>
    <link href="../resources/fore.css" rel="stylesheet">
    <script type="module" src="../index.js"></script>
</head>
<body>
<fx-fore>
    <!-- model -->
    <fx-model>
        <fx-instance>
            <data>
                <foo>10</foo>
                <bar>3</bar>
            </data>
        </fx-instance>
        <fx-bind ref="foo"
                 required="true()"
                 readonly="false()"
                 relevant=". > 5"
                 constraint=". > 7"></fx-bind>
        <fx-bind ref="bar"
                 constraint="let $v = ../foo return if($v > 6 and $v < 9) then true() else false()"></fx-bind>
    </fx-model>
</fx-fore>
</body>
</html>
