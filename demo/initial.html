<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes" name="viewport"/>
    <title>Initial values</title>
    <link href="../resources/demo.css" rel="stylesheet">
</head>
<body unresolved="unresolved">
<fore-corner href="../doc/demos.html" title="Back to Demos"></fore-corner>

<div class="wrapper">
    <h1>Initial values</h1>

    <p>
        The <code>initial</code> property of <code>fx-bind</code> is evaluated <em>once</em> during model
        initialization, before any <code>calculate</code>. It overwrites the existing value but - unlike
        <code>calculate</code> - leaves the node editable.
    </p>
    <demo-snippet>
        <template>
<fx-fore>
    <fx-model>
        <fx-instance type="html">
            <data>
                <date></date>
                <credit>100</credit>
                <debit>30</debit>
                <balance></balance>
            </data>
        </fx-instance>
        <fx-bind ref="date" initial="substring(string(current-date()), 1, 10)"></fx-bind>
        <fx-bind ref="balance" initial="0" calculate="../credit - ../debit"></fx-bind>
    </fx-model>
    <fx-group>
        <fx-control ref="date">
            <label>date (editable, set once)</label>
            <input type="date" class="widget">
        </fx-control>
        <fx-control ref="credit" update-event="input"><label>credit</label></fx-control>
        <fx-control ref="debit" update-event="input"><label>debit</label></fx-control>
        <p>Balance: <fx-output ref="balance"></fx-output></p>
    </fx-group>
</fx-fore>
        </template>
    </demo-snippet>
</div>

<script type="module" src="./demo.js"></script>
</body>
</html>
